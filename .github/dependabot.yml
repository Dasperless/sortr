# Keeps dependencies current without a stream of tiny PRs:
# - minor and patch updates are grouped into one PR per ecosystem;
# - major updates stay separate (they need a human decision, and are never
#   auto-merged, see the dependabot-merge job in workflows/ci.yml);
# - a release must be 7 days old before it is proposed (security updates ignore
#   the cooldown).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
