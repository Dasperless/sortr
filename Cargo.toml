[package]
name = "sortr"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "A fast, safe command-line file organizer"
license = "MIT"
repository = "https://github.com/Dasperless/sortr"

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.20"
toml = "0.9.6"

[dev-dependencies]
tempfile = "3.27.0"
